services:
  postgres:
    image: postgres:16-alpine
    container_name: aldy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aldy_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aldy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: amacneil/dbmate:2
    working_dir: /
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - ./db:/db
    command: ["up"]

  app:
    build: .
    container_name: aldy-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    ports:
      - "8080:8080"

volumes:
  pgdata:
